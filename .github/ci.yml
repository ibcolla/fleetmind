name: FleetMind CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: "ci-test-jwt-secret-key-32-chars-long!"
      SUPABASE_URL: "https://test-project.supabase.co"
      SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test-anon-key"
      STRIPE_SECRET_KEY: "sk_test_placeholder_key"
      STRIPE_WEBHOOK_SECRET: "whsec_test_placeholder_secret"
      ALLOWED_ORIGINS: "http://localhost:3000,https://app.fleetmind.com"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://test-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test-anon-key"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Production Next.js Build
        run: |
          cd frontend
          npm run build
